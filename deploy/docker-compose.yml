version: "3.8"

services:
  # --- Backend ---
  api:
    build:
      context: ..
      dockerfile: packages/api/Dockerfile
    container_name: oxly-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////data/oxly.db
      - JWT_SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEMO_MODE=${DEMO_MODE:-False}
    volumes:
      - api_data:/data
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  api_data:
